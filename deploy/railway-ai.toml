# FastAPI only. Use in Railway: Service → Settings → Config-as-code → deploy/railway-ai.toml
# Root directory: repository root (.). Same repo as backend/frontend services.
[build]
builder = "DOCKERFILE"
dockerfilePath = "ai-service/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30
