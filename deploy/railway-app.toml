# Frontend + backend (Node only). Pair with deploy/railway-ai.toml on a second Railway service.
# Set AI_BASE_URL on this service to the public https URL of the AI service (no trailing slash).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.app"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30
