# Root file kept for Railway defaults. Do not set a global dockerfilePath here — it would
# apply to every service in the repo. Instead:
# - Monolith: Config as code → deploy/railway-monolith.toml
# - Split:     deploy/railway-ai.toml | railway-backend.toml | railway-frontend.toml
#
[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
