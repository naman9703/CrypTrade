name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install & build (workspaces)
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: AI service deps + syntax check
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          python -m compileall -q ai-service/app

      - name: Docker build (app image)
        run: docker build -t trading-app:ci .
