# Production stack: trading app (API + static UI) + AI service.
#
# Prereqs: create backend/.env and ai-service/.env from *.example (never commit secrets).
# `app` loads secrets from bind-mounted backend/.env (normal `$2b$12$...` bcrypt).
# Do NOT copy those lines into the project root `./.env` — Compose always reads it and treats `$…` as interpolation.
# In backend/.env set at minimum:
#   NODE_ENV=production
#   AI_BASE_URL=http://ai:8001
#   FRONTEND_ORIGIN=https://YOUR_PUBLIC_HOST   (exact browser URL)
#   APP_UI_AUTH_ENABLED=1, SESSION_SECRET, user hashes, REQUIRE_APP_UI_AUTH_IN_PRODUCTION=1
#   TRUST_PROXY=1 when behind Caddy/nginx
#
# Build & run:
#   docker compose up -d --build
#
# Postgres/Timescale is service `timescale`. In backend/.env use:
#   DATABASE_URL=postgres://postgres:YOUR_PASSWORD@timescale:5432/trading
# Password must match POSTGRES_PASSWORD (Compose default tradingdev unless you set POSTGRES_PASSWORD in repo-root `.env`).
#
# App listens on : — publish only behind TLS (Caddy) or reverse-proxy host.

services:
  timescale:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    shm_size: "256mb"
    command:
      - postgres
      - -c
      - max_locks_per_transaction=512
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradingdev}
      POSTGRES_DB: trading
    volumes:
      - trading-timescale-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54333:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8001
      MODEL_DIR: /app/data/model
      FEEDBACK_CSV: /app/data/feedback/trades.csv
    volumes:
      - ai-model-data:/app/data
    expose:
      - "8001"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ai:
        condition: service_started
      timescale:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      SERVE_FRONTEND: "1"
      AI_BASE_URL: http://ai:8001
    volumes:
      - trading-data:/app/backend/data
      - ./backend/.env:/app/backend/.env:ro

volumes:
  ai-model-data:
  trading-data:
  trading-timescale-data:
